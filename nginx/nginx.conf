events {
    worker_connections 1024;
}

http {
    # Rate limiting — 30 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # Logging
    log_format main '$remote_addr - $remote_time [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Hide server version
    server_tokens off;

    # ---------------------------------------------------------------------------
    # Redirect HTTP → HTTPS
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ---------------------------------------------------------------------------
    # HTTPS — main API server
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name api.yourdomainhere.com;   # replace with your domain

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Modern TLS only
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        # Max request body — 2MB is more than enough for 12 months of transactions
        client_max_body_size 2m;

        # Proxy to FastAPI
        location / {
            limit_req zone=api burst=10 nodelay;

            proxy_pass         http://api:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
        }

        # Health check — no rate limiting
        location /health {
            proxy_pass http://api:8000/health;
        }
    }
}
